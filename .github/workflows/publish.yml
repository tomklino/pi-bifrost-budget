name: Stage npm release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '[0-9]*.[0-9]*.[0-9]*'

jobs:
  stage:
    if: github.event.created && !github.event.deleted
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Verify tag matches package version
        shell: bash
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo '::error::The release tag must match the version in package.json (with an optional v prefix).'
            exit 1
          fi

      - run: npm test

      - name: Stage package for approval
        shell: bash
        run: |
          version="${GITHUB_REF_NAME%%+*}"
          if [[ "$version" == *-* ]]; then
            npm stage publish --access public --tag next
          else
            npm stage publish --access public --tag latest
          fi
